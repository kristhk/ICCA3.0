<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0807">
  <!--SEO-->
  <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/galeria.css">
</head>
<body class="page-gallery is-ready">
  <a class="skip" href="#artContainer">Saltar a las obras</a>
  <div class="grain" aria-hidden="true"></div>

  <!-- Barra de navegación (la misma de la landing) -->
  <header class="topbar is-scrolled" id="topbar">
    <a class="brand" href="/" id="brand" data-cms="site_name">ICCA</a>
    <nav class="menu" id="menu" aria-label="Principal">
      <a href="/">Inicio</a>
      <a href="/galeria.html" class="active" aria-current="page">Galería</a>
      <a href="/#notas">Secretos</a>
      <a href="/#lienzo">Experiencia</a>
      <a href="/#contacto" class="menu-contact-mobile">Contáctanos</a>
    </nav>
    <a href="/#contacto" class="btn-outline nav-cta">Contáctanos</a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"><span></span><span></span><span></span></button>
  </header>
  <div class="nav-boundary-line" aria-hidden="true"></div>

  <!-- Aviso de cómo se usa (se oculta solo después de unos segundos) -->
  <div class="instruction-banner" id="hint">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
    Arrastra las obras · Tócalas para descubrir su historia
  </div>

  <!-- LIENZO LIBRE: aquí se generan las obras y se pueden mover -->
  <main class="gallery-viewport" id="galleryViewport">
    <h1 class="sr-only" data-cms="collection_title">Galería</h1>
    <div id="artContainer" aria-label="Obras de la galería"></div>
  </main>

  <!-- Barra flotante de herramientas -->
  <div class="toolbar-container" role="toolbar" aria-label="Herramientas de la galería">
    <div class="counter-pill" id="exploredCounter" aria-live="polite">Exploradas: 0 / 0</div>
    <button class="tool-btn active" id="btnScatter" type="button" aria-pressed="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg> Esparcir
    </button>
    <button class="tool-btn" id="btnGrid" type="button" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> <span class="hide-sm">Ordenar en grilla</span><span class="show-sm">Grilla</span>
    </button>
    <button class="tool-btn" id="btnLamp" type="button" aria-pressed="false" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 2h6l-1 7h-4z"/><path d="M10 9v11a2 2 0 0 0 4 0V9"/><path d="M12 13v2"/></svg> Linterna
    </button>
    <label class="tool-select" id="filterWrap" hidden>
      <span class="sr-only">Filtrar por técnica</span>
      <select id="filterSelect"><option value="all">Todas las técnicas</option></select>
    </label>
  </div>

  <!-- MODAL DE LA OBRA: imagen con lupa + información -->
  <div class="g-modal" id="artModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="g-modal-card">
      <button class="g-close" id="btnCloseModal" type="button" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>

      <!-- Columna izquierda: imagen y lupa -->
      <div class="g-modal-media" id="imgWrapper">
        <div class="zoom-lens" id="zoomLens" aria-hidden="true"></div>
        <img alt="" id="modalImg" class="g-modal-img" draggable="false">
        <div class="zoom-hint">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span id="zoomHintText">Pasa el cursor sobre la obra para hacer zoom</span>
        </div>
        <button class="g-full" id="btnFull" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          Pantalla completa
        </button>
      </div>

      <!-- Columna derecha: información -->
      <div class="g-modal-content">
        <div>
          <div class="g-meta-row">
            <span class="g-movement" id="modalMovement"></span>
            <span class="g-year" id="modalYear"></span>
          </div>
          <h2 class="g-title" id="modalTitle"></h2>
          <p class="g-artist" id="modalArtist"></p>

          <!-- Audioguía -->
          <div class="audio-player-card" id="audioCard">
            <button id="btnAudioPlay" class="audio-play-btn" type="button" aria-label="Reproducir audioguía">
              <svg class="i-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
              <svg class="i-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
            </button>
            <div class="audio-info">
              <div class="audio-top">
                <span class="audio-label">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>
                  Audioguía narrada
                </span>
                <span class="audio-status" id="audioStatus">Listo para reproducir</span>
              </div>
              <div class="eq" id="eqVisualizer" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>
          </div>

          <!-- Pestañas -->
          <div class="g-tabs" role="tablist">
            <button class="g-tab active" type="button" role="tab" data-tab="context" aria-selected="true">Contexto</button>
            <button class="g-tab" type="button" role="tab" data-tab="technique" aria-selected="false">Técnica</button>
            <button class="g-tab" type="button" role="tab" data-tab="symbolism" aria-selected="false">Simbolismo</button>
            <button class="g-tab" type="button" role="tab" data-tab="secrets" aria-selected="false">Secretos</button>
          </div>
          <div class="g-tab-content" id="tabContent" role="tabpanel"></div>
        </div>

        <!-- Pie: ubicación y navegación entre obras -->
        <div class="g-modal-foot">
          <div class="g-location">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="modalLocation"></span>
          </div>
          <div class="g-nav">
            <button class="modal-nav-btn" id="btnPrevArt" type="button">‹ Anterior</button>
            <button class="modal-nav-btn" id="btnNextArt" type="button">Siguiente ›</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Visor a pantalla completa (el mismo de la landing) -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Visor de obras" hidden>
    <div class="viewer-bar">
      <span class="viewer-count" id="vCount"></span>
      <div class="viewer-tools">
        <button type="button" id="vAudio" aria-label="Escuchar audioguía" title="Audioguía">Escuchar</button>
        <button type="button" id="vInfo" aria-expanded="false" title="Información de la obra (tecla i)">Información</button>
        <button type="button" id="vShare" title="Copiar enlace a esta obra">Copiar enlace</button>
        <button type="button" id="vClose" aria-label="Cerrar visor (Esc)">Cerrar</button>
      </div>
    </div>
    <div class="viewer-stage" id="vStage">
      <img id="vImg" alt="" draggable="false">
      <button class="viewer-nav prev" id="vPrev" aria-label="Obra anterior"><span aria-hidden="true">‹</span></button>
      <button class="viewer-nav next" id="vNext" aria-label="Obra siguiente"><span aria-hidden="true">›</span></button>
      <p class="viewer-hint" id="vHint">Toca la obra para acercarte</p>
    </div>
    <div class="viewer-caption">
      <span class="cartela-title" id="vTitle"></span>
      <span class="cartela-meta" id="vMeta"></span>
    </div>
    <aside class="viewer-info" id="vPanel" hidden>
      <div class="tabs" role="tablist" id="vTabs"></div>
      <div class="tab-body" id="vTabBody" role="tabpanel"></div>
      <p class="viewer-loc" id="vLoc"></p>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/cms-data.js"></script>
  <script src="/js/cms.js"></script>
  <script src="/js/viewer.js"></script>
  <script src="/js/home.js"></script>
  <script src="/js/galeria.js"></script>
</body>
</html>
